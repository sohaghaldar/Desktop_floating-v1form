<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Silk Web Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="0" y="0" width="900" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Window Header / Titlebar -->
  <rect x="0" y="0" width="900" height="38" rx="16" fill="#0f172a" />
  <rect x="0" y="24" width="900" height="14" fill="#0f172a" />
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Control Dots -->
  <circle cx="22" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="58" cy="19" r="6" fill="#10b981" />

  <!-- Titlebar Text -->
  <text x="450" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DESKTOP FLOATING — LIVING COMPANION OVERLAY (100% CLICK-THROUGH)</text>

  <!-- Desktop Simulation: Faint Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="38" x2="50" y2="445" />
    <line x1="150" y1="38" x2="150" y2="445" />
    <line x1="250" y1="38" x2="250" y2="445" />
    <line x1="350" y1="38" x2="350" y2="445" />
    <line x1="450" y1="38" x2="450" y2="445" />
    <line x1="550" y1="38" x2="550" y2="445" />
    <line x1="650" y1="38" x2="650" y2="445" />
    <line x1="750" y1="38" x2="750" y2="445" />
    <line x1="850" y1="38" x2="850" y2="445" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="200" x2="900" y2="200" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="0" y1="400" x2="900" y2="400" />
  </g>

  <!-- Left Side: Procedural Orb-Web & Spider -->
  <g transform="translate(240, 190)">
    <!-- Ceiling Anchor Thread -->
    <line x1="0" y1="-152" x2="0" y2="-90" stroke="#00f5d4" stroke-width="1.8" opacity="0.8" />
    <circle cx="0" cy="-152" r="3" fill="#00f5d4" filter="url(#cyanGlow)" />

    <!-- Web Spokes (8 Radial Lines) -->
    <g stroke="#38bdf8" stroke-width="1.2" opacity="0.6">
      <line x1="0" y1="0" x2="0" y2="-90" />
      <line x1="0" y1="0" x2="64" y2="-64" />
      <line x1="0" y1="0" x2="90" y2="0" />
      <line x1="0" y1="0" x2="64" y2="64" />
      <line x1="0" y1="0" x2="0" y2="90" />
      <line x1="0" y1="0" x2="-64" y2="64" />
      <line x1="0" y1="0" x2="-90" y2="0" />
      <line x1="0" y1="0" x2="-64" y2="-64" />
    </g>

    <!-- Concentric Web Spirals -->
    <polygon points="0,-24 17,-17 24,0 17,17 0,24 -17,17 -24,0 -17,-17" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.45" />
    <polygon points="0,-48 34,-34 48,0 34,34 0,48 -34,34 -48,0 -34,-34" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.5" />
    <polygon points="0,-72 51,-51 72,0 51,51 0,72 -51,51 -72,0 -51,-51" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6" />

    <!-- Dewdrops on Web -->
    <circle cx="17" cy="-17" r="2.2" fill="#e0f2fe" filter="url(#cyanGlow)" />
    <circle cx="-34" cy="34" r="2.5" fill="#e0f2fe" filter="url(#cyanGlow)" />
    <circle cx="51" cy="51" r="2.8" fill="#e0f2fe" filter="url(#cyanGlow)" />

    <!-- Living Cyber Spider (Center / Hub) -->
    <g transform="translate(0, 0)">
      <!-- Legs (8 IK segments) -->
      <path d="M-6,-4 Q-22,-20 -36,-16 Q-44,-12 -46,4" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-7,-1 Q-26,-8 -42,2 Q-48,10 -48,22" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-7,3 Q-24,12 -38,24 Q-44,34 -42,44" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-5,7 Q-18,22 -28,38 Q-32,48 -28,54" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />

      <path d="M6,-4 Q22,-20 36,-16 Q44,-12 46,4" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M7,-1 Q26,-8 42,2 Q48,10 48,22" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M7,3 Q24,12 38,24 Q44,34 42,44" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />
      <path d="M5,7 Q18,22 28,38 Q32,48 28,54" fill="none" stroke="#00f5d4" stroke-width="2.2" stroke-linecap="round" />

      <!-- Abdomen & Thorax -->
      <ellipse cx="0" cy="8" rx="8" ry="11" fill="#00f5d4" stroke="#ffffff" stroke-width="1.2" filter="url(#cyanGlow)" />
      <ellipse cx="0" cy="-3" rx="5.5" ry="6.5" fill="#0284c7" stroke="#ffffff" stroke-width="1" />

      <!-- Glowing Cyber Eyes -->
      <circle cx="-2.5" cy="-7" r="1.8" fill="#ff0055" />
      <circle cx="2.5" cy="-7" r="1.8" fill="#ff0055" />
    </g>

    <!-- Label -->
    <text x="0" y="112" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🕷️ SILK ARACHNID (SPIDER)</text>
    <text x="0" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Procedural IK Legs &amp; Orb-Web</text>
  </g>

  <!-- Right Side: Graceful Cyber Butterfly -->
  <g transform="translate(660, 190)">
    <!-- Fairy Dust Stardust Sparkles -->
    <g fill="#fbbf24" opacity="0.8">
      <circle cx="-45" cy="-35" r="2" filter="url(#goldGlow)" />
      <circle cx="-65" cy="15" r="2.5" filter="url(#goldGlow)" />
      <circle cx="-25" cy="45" r="1.8" filter="url(#goldGlow)" />
      <circle cx="55" cy="-50" r="2.2" filter="url(#goldGlow)" />
      <circle cx="70" cy="25" r="2" filter="url(#goldGlow)" />
    </g>

    <!-- Butterfly Wings (Upper & Lower) -->
    <g filter="url(#goldGlow)">
      <!-- Left Forewing -->
      <path d="M-4,-2 C-35,-55 -85,-40 -70,-5 C-60,18 -30,12 -4,4 Z" fill="#f59e0b" fill-opacity="0.85" stroke="#fef08a" stroke-width="1.5" />
      <circle cx="-42" cy="-22" r="5" fill="#d97706" />

      <!-- Left Hindwing -->
      <path d="M-4,5 C-40,16 -65,42 -40,65 C-20,72 -10,45 -4,12 Z" fill="#d97706" fill-opacity="0.8" stroke="#fde68a" stroke-width="1.2" />

      <!-- Right Forewing -->
      <path d="M4,-2 C35,-55 85,-40 70,-5 C60,18 30,12 4,4 Z" fill="#f59e0b" fill-opacity="0.85" stroke="#fef08a" stroke-width="1.5" />
      <circle cx="42" cy="-22" r="5" fill="#d97706" />

      <!-- Right Hindwing -->
      <path d="M4,5 C40,16 65,42 40,65 C20,72 10,45 4,12 Z" fill="#d97706" fill-opacity="0.8" stroke="#fde68a" stroke-width="1.2" />
    </g>

    <!-- Butterfly Body & Antennae -->
    <ellipse cx="0" cy="5" rx="3.5" ry="18" fill="#451a03" stroke="#fef3c7" stroke-width="1" />
    <circle cx="0" cy="-14" r="3.5" fill="#78350f" />
    <path d="M-2,-16 Q-12,-30 -18,-28" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
    <path d="M2,-16 Q12,-30 18,-28" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />

    <!-- Label -->
    <text x="0" y="112" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🦋 FLUTTERING BUTTERFLY</text>
    <text x="0" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">Metamorphosis &amp; Organic Flapping</text>
  </g>

  <!-- Center Floating Onboarding Card (As Seen On Screen) -->
  <g transform="translate(450, 360)">
    <!-- Outer Glow -->
    <rect x="-260" y="-30" width="520" height="60" rx="12" fill="none" stroke="#00f5d4" stroke-width="1.2" opacity="0.7" />
    <!-- Glass Body -->
    <rect x="-258" y="-28" width="516" height="56" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" />

    <!-- Card Text -->
    <text x="0" y="-8" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">✨ WELCOME TO DESKTOP FLOATING PET ECOSYSTEM ✨</text>
    <text x="0" y="12" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
      🎮 <tspan fill="#00f5d4" font-weight="bold">Shift+M</tspan>: Switch Creature (Spider ↔ Butterfly)  |  <tspan fill="#00f5d4" font-weight="bold">Shift+P</tspan>: Live Settings
    </text>
    <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">📍 24/7 System Tray Icon near clock | 🖱️ 100% Click-Through Overlay</text>
  </g>

  <!-- Bottom Taskbar -->
  <rect x="0" y="445" width="900" height="35" rx="0" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  
  <!-- Left Windows Taskbar Apps (Clean, Zero Clutter) -->
  <rect x="18" y="452" width="20" height="20" rx="3" fill="#38bdf8" opacity="0.8" />
  <circle cx="58" cy="462" r="10" fill="#ea4335" />
  <rect x="80" y="452" width="20" height="20" rx="4" fill="#0284c7" />
  <text x="115" y="466" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Zero Taskbar Clutter (Overlay runs seamlessly in background)</text>

  <!-- Right System Tray (Clock & Cyber Tray Icon) -->
  <g transform="translate(820, 452)">
    <!-- Cyber Tray Spider Icon -->
    <circle cx="0" cy="10" r="8" fill="#090d16" stroke="#00f5d4" stroke-width="1.2" />
    <circle cx="0" cy="10" r="3" fill="#00f5d4" filter="url(#cyanGlow)" />
    <!-- Clock -->
    <text x="25" y="14" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">05:25 PM</text>
  </g>
</svg>
